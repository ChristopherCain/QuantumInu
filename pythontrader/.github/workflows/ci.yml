name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src/pythontrader tests scripts
      - run: mypy src/pythontrader
      - run: pytest --cov=pythontrader --cov-report=term-missing --cov-report=xml
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/benchmark_json.py --events 10000 --output artifacts/benchmark.json
      - run: python scripts/benchmark_execution_v4.py --iterations 10000 --json
      - run: python scripts/benchmark_reliability_v5.py --iterations 10000 --json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: artifacts/benchmark.json
